services:
  app:
    build:
      context: .
    environment:
      NODE_ENV: production
      SERVER_PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-stationos}:${POSTGRES_PASSWORD:-stationos}@timescaledb:5432/${POSTGRES_DB:-stationos}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
    ports:
      - "${SERVER_PORT:-5000}:5000"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stationos}
      POSTGRES_USER: ${POSTGRES_USER:-stationos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stationos}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  timescaledb_data:
